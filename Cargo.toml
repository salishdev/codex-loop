[package]
name = "codex-loop"
version = "0.1.0"
edition = "2024"
description = "Run a fresh Codex prompt repeatedly at a fixed interval"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
humantime = "2.3"
libc = "0.2"
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3.23"
