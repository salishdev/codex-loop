name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release aarch64 macOS binary
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      TARGET: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustup target add "$TARGET"

      - name: Verify tag matches package version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "codex-loop") | .version')
          expected_tag="v${version}"

          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=codex-loop-${expected_tag}-${TARGET}.tar.gz" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features --target "$TARGET" -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features --target "$TARGET"

      - name: Build release binary
        run: cargo build --locked --release --target "$TARGET"

      - name: Package release
        run: |
          package="codex-loop-v${VERSION}-${TARGET}"
          mkdir -p "dist/$package"
          cp "target/${TARGET}/release/codex-loop" "dist/$package/"
          cp README.md "dist/$package/"
          tar -C dist -czf "dist/$ARCHIVE" "$package"
          (cd dist && shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256")

      - name: Smoke test packaged binary
        run: "dist/codex-loop-v${VERSION}-${TARGET}/codex-loop --help"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/$ARCHIVE" \
            "dist/$ARCHIVE.sha256" \
            --verify-tag \
            --generate-notes \
            --title "codex-loop $GITHUB_REF_NAME"
